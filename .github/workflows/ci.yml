name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only a pull request drops its older run. Every commit on main finishes, or the README badge keeps showing the last run that did.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: File Explorer preview — renderer tests
        run: npm run test:preview
      - name: File Explorer preview — build, register and preview a document like Explorer does
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          npm run build:preview
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          powershell -NoProfile -STA -ExecutionPolicy Bypass -File preview/ci-check.ps1 -Dll preview-dist/NeoMarkdownPreview.dll -Register
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: End-to-end test (real app)
        if: runner.os != 'Linux'
        run: npm run test:e2e
      - name: End-to-end test (real app, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e

  package-windows:
    name: Package Windows .exe
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Install silently and check the File Explorer preview registration
        shell: powershell
        run: |
          $setup = Get-ChildItem release/RTMarkdownReader-*-Setup.exe | Select-Object -First 1
          Start-Process -Wait -FilePath $setup.FullName -ArgumentList '/S'
          powershell -NoProfile -STA -ExecutionPolicy Bypass -File preview/ci-check.ps1 -Installed
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # The installed list (3.14): the installer says Reader is here, with a path that really starts it.
          $listed = Join-Path $env:APPDATA 'Recon Towers\app-link\installed\rt-markdown-reader.json'
          if (-not (Test-Path $listed)) { throw "The installer didn't write $listed" }
          $entry = Get-Content -Raw -Encoding UTF8 $listed | ConvertFrom-Json
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          if ($entry.id -ne 'rt-markdown-reader' -or $entry.protocol -ne 1 -or $entry.version -ne $version) { throw "The installed file is wrong: $(Get-Content -Raw $listed)" }
          if (-not (Test-Path -LiteralPath $entry.launch -PathType Leaf) -or $entry.launch -notmatch '\.exe$') { throw "The installed file's path doesn't start the app: $($entry.launch)" }
          node -e "const {readInstalled}=require('./src/main/installed.js'); const a=readInstalled(process.env.APPDATA+'\\Recon Towers\\app-link'); if(!a.some(x=>x.id==='rt-markdown-reader'&&x.known)) { console.error(JSON.stringify(a)); process.exit(1) } console.log('the app reads the installer\'s file')"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\neo-markdown-reader'
          if (-not (Test-Path $dir)) { $dir = Join-Path $env:LOCALAPPDATA 'Programs\RT Markdown Reader' }
          $un = Get-ChildItem $dir -Filter 'Uninstall*.exe' | Select-Object -First 1
          Start-Process -Wait -FilePath $un.FullName -ArgumentList '/S', "_?=$dir"
          powershell -NoProfile -File preview/ci-check.ps1 -Uninstalled
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (Test-Path $listed) { throw "Uninstalling left $listed behind" }
      - name: Update from the last version with the old name, for one person and for everyone
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v3.3.0 -R neogentrics/rt-markdown-reader -p 'NeoMarkdownReader-3.3.0-Setup.exe' -D old-release
          $new = Get-ChildItem release/RTMarkdownReader-*-Setup.exe | Select-Object -First 1
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/ci-update-check.ps1 -OldSetup (Resolve-Path old-release/NeoMarkdownReader-3.3.0-Setup.exe).Path -NewSetup $new.FullName
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Upload installer + portable exe
        uses: actions/upload-artifact@v7
        with:
          name: RTMarkdownReader-windows-${{ github.sha }}
          path: |
            release/RTMarkdownReader-*-Setup.exe
            release/RTMarkdownReader-*-Portable.exe
          retention-days: 14
